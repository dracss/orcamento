name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.36" buildozer

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (debug)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          # Tenta várias vezes: downloads de dependências (Maven/NDK) às vezes
          # respondem 429/502 no runner compartilhado. O buildozer é incremental,
          # então cada nova tentativa retoma direto na etapa que faltou (Gradle).
          for i in 1 2 3 4 5; do
            echo "===== Tentativa de build $i ====="
            buildozer android debug && break
            echo "Tentativa $i falhou (provável limite de download). Aguardando 120s..."
            sleep 120
          done
          echo "== Verificando APK gerado =="
          ls -la bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk

          - name: Publicar Release (link fixo, sempre com o APK mais novo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest bin/*.apk \
            --title "Orçamentos JM — última versão" \
            --notes "APK mais recente do app. Baixe o arquivo .apk e instale no celular (ative 'instalar apps desconhecidos' quando pedir)." \
            --latest
